<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doppi Sconti</title>
  <style>
    :root{
      --bg:#0b1220;
      --text:#eef5ff;
      --muted:rgba(238,245,255,.72);
      --border:rgba(255,255,255,.14);
      --ok:#36d399;
      --danger:#ff4d6d;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%,rgba(78,161,255,.25),transparent 60%),
        radial-gradient(900px 600px at 90% 20%,rgba(40,215,198,.20),transparent 55%),
        radial-gradient(900px 700px at 50% 110%,rgba(255,77,109,.12),transparent 55%),
        var(--bg);
      min-height:100dvh;
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app{
      width:min(560px,100%);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.05));
    }

    header{
      padding:14px 14px 10px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
      background:rgba(0,0,0,.12);
    }
    .title{line-height:1.05}
    .title h1{margin:0;font-size:20px;letter-spacing:.2px}
    .title p{margin:6px 0 0;font-size:13px;color:var(--muted)}
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
      background:rgba(255,255,255,.06);
    }

    main{
      padding:12px 14px 14px;
      display:grid;
      gap:10px;
    }

    .row{display:grid;gap:8px}

    label{
      font-size:13px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.2px;
      text-transform:uppercase;
    }

    input[type="number"]{
      width:100%;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.08);
      color:var(--text);
      padding:12px 14px;
      font-size:18px;
      outline:none;
    }
    input::placeholder{color:rgba(238,245,255,.45)}
    input:focus{
      border-color:rgba(78,161,255,.65);
      box-shadow:0 0 0 4px rgba(78,161,255,.18);
    }

    .sections{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    @media(max-width:420px){
      .sections{grid-template-columns:1fr}
    }

    .panel{
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      border-radius:16px;
      padding:10px;
    }
    .panel h2{
      margin:0 0 8px;
      font-size:13px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.7px;
      font-weight:800;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    button{
      border:1px solid var(--border);
      background:rgba(255,255,255,.08);
      color:var(--text);
      border-radius:14px;
      padding:14px 10px;
      font-size:18px;
      font-weight:900;
      min-height:54px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:transform .08s ease,background .15s ease,border-color .15s ease;
    }
    button:active{transform:scale(.98)}

    .btn-discount.active{
      background:linear-gradient(135deg,rgba(78,161,255,.35),rgba(40,215,198,.22));
      border-color:rgba(78,161,255,.6);
      position:relative;
    }
    .btn-discount.active::after{
      content:"✓";
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      font-size:16px;
      opacity:.95;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .btn-clear{
      background:rgba(255,77,109,.12);
      border-color:rgba(255,77,109,.45);
    }

    .results{
      border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(78,161,255,.12),rgba(40,215,198,.10));
      border-radius:16px;
      padding:10px 12px;
      display:grid;
      gap:6px;
    }
    .line{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:13px;
      color:var(--muted);
    }
    .line strong{
      color:var(--text);
      font-size:14px;
      font-weight:900;
    }
    .big{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      padding-top:8px;
      margin-top:4px;
      border-top:1px solid rgba(255,255,255,.12);
    }
    .big .label{font-size:14px;font-weight:900}
    .big .value{font-size:26px;font-weight:900;color:var(--ok)}
    .hint{font-size:12px;color:rgba(238,245,255,.7);text-align:center;margin-top:2px}

    @media(max-height:740px){
      header{padding:12px 14px 8px}
      .title h1{font-size:19px}
      main{gap:8px}
      button{min-height:52px}
      .big .value{font-size:24px}
    }
  </style>
</head>

<body>
  <div class="app" role="application" aria-label="Calcolatore doppi sconti">
    <header>
      <div class="title">
        <h1>Doppi Sconti</h1>
        <p>Inserisci prezzo e seleziona 1 o 2 sconti.</p>
      </div>
      <div class="pill" id="statusPill">Pronto</div>
    </header>

    <main>
      <section class="row">
        <label for="price">Prezzo di cartellino (€)</label>
        <input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Es. 79.90" />
      </section>

      <section class="sections" aria-label="Selezione sconti">
        <div class="panel">
          <h2>Primo sconto</h2>
          <div class="grid">
            <button class="btn-discount" data-group="first" data-discount="50">50%</button>
            <button class="btn-discount" data-group="first" data-discount="30">30%</button>
            <button class="btn-discount" data-group="first" data-discount="20">20%</button>
            <button class="btn-discount" data-group="first" data-discount="15">15%</button>
          </div>
        </div>

        <div class="panel">
          <h2>Secondo sconto</h2>
          <div class="grid">
            <button class="btn-discount" data-group="second" data-discount="50">50%</button>
            <button class="btn-discount" data-group="second" data-discount="30">30%</button>
            <button class="btn-discount" data-group="second" data-discount="20">20%</button>
            <button class="btn-discount" data-group="second" data-discount="15">15%</button>
          </div>
        </div>
      </section>

      <section class="actions">
        <button class="btn-clear" id="btnReset" type="button">Azzera</button>
      </section>

      <section class="results" aria-label="Risultati">
        <div class="line"><span>Originale</span><strong id="rOriginal">€0,00</strong></div>
        <div class="line"><span id="rD1Label">Sconto 1</span><strong id="rD1">—</strong></div>
        <div class="line"><span id="rD2Label">Sconto 2</span><strong id="rD2">—</strong></div>
        <div class="line"><span>Risparmio totale</span><strong id="rSaved">—</strong></div>
        <div class="big">
          <div class="label">Prezzo finale</div>
          <div class="value" id="rFinal">€0,00</div>
        </div>
        <div class="hint" id="rInfo">Seleziona almeno il primo sconto.</div>
      </section>
    </main>
  </div>

  <script>
    var state = { first: null, second: null };
    function el(id){ return document.getElementById(id); }

    var priceInput = el("price");
    var statusPill = el("statusPill");

    var rOriginal = el("rOriginal");
    var rD1Label = el("rD1Label");
    var rD1 = el("rD1");
    var rD2Label = el("rD2Label");
    var rD2 = el("rD2");
    var rSaved = el("rSaved");
    var rFinal = el("rFinal");
    var rInfo = el("rInfo");

    var btnReset = el("btnReset");

    function eur(n){
      var v = (typeof n === "number" && isFinite(n)) ? n : 0;
      return v.toLocaleString("it-IT", { style: "currency", currency: "EUR" });
    }

    function setActive(group, discount){
      var buttons = document.querySelectorAll('.btn-discount[data-group="' + group + '"]');
      for (var i=0; i<buttons.length; i++){
        var b = buttons[i];
        b.classList.toggle("active", Number(b.getAttribute("data-discount")) === discount);
      }
    }

    function toggleDiscount(group, discount){
      state[group] = (state[group] === discount) ? null : discount;
      setActive(group, state[group]);
      calculate();
    }

    function calculate(){
      var raw = String(priceInput.value || "").replace(",", ".");
      var price = parseFloat(raw);

      rOriginal.textContent = eur(price);

      if (!price || price <= 0){
        statusPill.textContent = "Inserisci prezzo";
        rD1Label.textContent = "Sconto 1";
        rD1.textContent = "—";
        rD2Label.textContent = "Sconto 2";
        rD2.textContent = "—";
        rSaved.textContent = "—";
        rFinal.textContent = eur(0);
        rInfo.textContent = "Inserisci un prezzo valido.";
        return;
      }

      if (!state.first){
        statusPill.textContent = "Seleziona 1° sconto";
        rD1Label.textContent = "Sconto 1";
        rD1.textContent = "—";
        rD2Label.textContent = "Sconto 2";
        rD2.textContent = "—";
        rSaved.textContent = "—";
        rFinal.textContent = eur(price);
        rInfo.textContent = "Seleziona almeno il primo sconto.";
        return;
      }

      var cut1 = price * (state.first / 100);
      var after1 = price - cut1;

      var cut2 = 0;
      var final = after1;

      if (state.second){
        cut2 = after1 * (state.second / 100);
        final = after1 - cut2;
      }

      var saved = price - final;
      var eff = (saved / price) * 100;

      statusPill.textContent = "Calcolato";
      rD1Label.textContent = "Sconto 1 (" + state.first + "%)";
      rD1.textContent = "− " + eur(cut1);

      if (state.second){
        rD2Label.textContent = "Sconto 2 (" + state.second + "%) su scontato";
        rD2.textContent = "− " + eur(cut2);
        rInfo.textContent = "Sconto effettivo totale: " + eff.toFixed(2) + "%";
      } else {
        rD2Label.textContent = "Sconto 2 (facoltativo)";
        rD2.textContent = "—";
        rInfo.textContent = "Secondo sconto non applicato.";
      }

      rSaved.textContent = "− " + eur(saved);
      rFinal.textContent = eur(final);
    }

    // Eventi bottoni sconto
    var discountButtons = document.querySelectorAll(".btn-discount");
    for (var i=0; i<discountButtons.length; i++){
      (function(btn){
        btn.addEventListener("click", function(){
          toggleDiscount(btn.getAttribute("data-group"), Number(btn.getAttribute("data-discount")));
        });
      })(discountButtons[i]);
    }

    priceInput.addEventListener("input", calculate);

    btnReset.addEventListener("click", function(){
      state.first = null;
      state.second = null;
      priceInput.value = "";
      setActive("first", null);
      setActive("second", null);
      calculate();
    });

    calculate();
  </script>
</body>
</html>
